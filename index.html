
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hacker Tracker Simulator</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: #020805;
  color: #00ff88;
  font-family: Consolas, monospace;
}

.panel {
  max-width: 650px;
  margin: 20px auto;
  padding: 22px;
  background: #07120c;
  border: 1px solid #00ff88;
  border-radius: 15px;
  box-shadow: 0 0 25px #00ff8822;
}

h1 {
  text-align: center;
  font-size: clamp(22px, 5vw, 34px);
  text-shadow: 0 0 12px #00ff88;
}

.demo {
  text-align: center;
  color: #ffd76a;
  font-size: 12px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 20px;
  border: 0;
  border-radius: 7px;
  background: #00ff88;
  color: #001b0d;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}

.terminal {
  margin-top: 20px;
  padding: 15px;
  min-height: 140px;
  background: #000;
  border: 1px solid #174b32;
  line-height: 1.9;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.map {
  height: 240px;
  margin-top: 20px;
  position: relative;
  overflow: hidden;
  border: 1px solid #00ff88;
  background:
    linear-gradient(#00ff8818 1px, transparent 1px),
    linear-gradient(90deg, #00ff8818 1px, transparent 1px),
    #04100b;
  background-size: 25px 25px;
}

.target {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  animation: pulse 1.5s infinite;
}

.dot { font-size: 35px; }

@keyframes pulse {
  50% { opacity: .4; }
}

.info {
  padding: 10px 0;
  border-bottom: 1px solid #174b32;
  overflow-wrap: anywhere;
}

span { color: #fff; }

.small {
  color: #9bb5a5;
  font-size: 12px;
  line-height: 1.6;
}

@media (max-width: 400px) {
  body { padding: 10px; }
  .panel { padding: 15px; }
}
</style>
</head>

<body>
<div class="panel">
  <h1>⌘ TRACKER SYSTEM</h1>
  <p class="demo">● SIMULATION MODE — DEMO</p>

  <button onclick="startScan()">
    START SIMULATION
  </button>

  <div class="terminal" id="terminal">>
SYSTEM READY
> Menunggu arahan...</div>

  <div class="map">
    <div class="target">
      <div class="dot">⌖</div>
      TARGET DEMO
    </div>
  </div>

  <div class="info">
    STATUS: <span id="status">STANDBY</span>
  </div>
  <div class="info">
    LATITUDE: <span id="lat">--</span>
  </div>
  <div class="info">
    LONGITUDE: <span id="lon">--</span>
  </div>

  <p class="small">
    Ini simulasi visual sahaja. Koordinat yang dipaparkan
    ialah data contoh, bukannya lokasi sebenar seseorang.
  </p>
</div>

<script>
function startScan() {
  const terminal = document.getElementById("terminal");
  const status = document.getElementById("status");
  const lat = document.getElementById("lat");
  const lon = document.getElementById("lon");

  const lines = [
    "> Initializing system...",
    "> Loading demo map...",
    "> Scanning simulated target...",
    "> Generating sample coordinates...",
    "> DEMO TARGET FOUND!"
  ];

  terminal.textContent = "";
  status.textContent = "SCANNING...";
  lat.textContent = "--";
  lon.textContent = "--";

  let i = 0;

  function nextLine() {
    if (i < lines.length) {
      terminal.textContent += lines[i] + "\n";
      i++;
      setTimeout(nextLine, 600);
    } else {
      lat.textContent = "3.1390° N";
      lon.textContent = "101.6869° E";
      status.textContent = "SIMULATION COMPLETE";
    }
  }

  nextLine();
}
</script>
</body>
</html>
